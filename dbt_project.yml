# Eco Essentials — Cloud Data Warehouse (dbt project)
# Transforms raw Snowflake landing data into a tested star-schema warehouse.

name: 'eco_essentials'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Eco Essentials models are materialized as tables in the DW_ECOESSENTIALS schema.
models:
  eco_essentials:
    ecoessentials:
      +materialized: table
